<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Reading Schedule</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5eed8;min-height:100vh;padding:1rem 0.75rem 3rem;color:#2c1f0e}
.hdr{padding:1.25rem;border:1px solid #c4a45a;border-radius:12px;background:#fdf8ed;margin-bottom:1rem;text-align:center}
.stats{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;padding-top:.75rem;border-top:1px solid #c4a45a;margin-top:.75rem}
.sv{font-size:1.4rem;font-weight:600;color:#8b3a1a}
.sl{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:#8b6914}
.pw{background:rgba(196,164,90,0.25);height:5px;border-radius:3px;overflow:hidden;margin:.5rem 0 .2rem}
.pf{height:100%;background:#8b3a1a;transition:width .3s;border-radius:3px}
.pl{font-size:.7rem;color:#8b6914;text-align:right}
.ban{border-left:4px solid #8b3a1a;background:#fff8e8;padding:.65rem .9rem;border-radius:0 8px 8px 0;margin-bottom:.75rem;display:none}
.ban.show{display:block}
.confirmbar{background:#fff3cd;border:1px solid #c9a84c;border-radius:8px;padding:.6rem .9rem;margin-bottom:.75rem;display:none;align-items:center;gap:.75rem;flex-wrap:wrap}
.confirmbar.show{display:flex}
.br{display:flex;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
button{background:transparent;border:1px solid #c4a45a;border-radius:8px;padding:.45rem .9rem;font-size:.78rem;cursor:pointer;color:#2c1f0e;font-family:inherit;-webkit-tap-highlight-color:transparent}
button:active{opacity:.7}
button.pri{background:#8b3a1a;color:#fdf8ed;border-color:#8b3a1a}
button.danger{background:#fff0f0;color:#c0392b;border-color:#e57373}
.wh{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#8b6914;padding:.25rem .6rem;background:#f0e8d0;border-radius:8px 8px 0 0;border:1px solid #c4a45a;border-bottom:none;display:inline-block}
.wb{border:1px solid #c4a45a;border-radius:0 8px 8px 8px;background:#fdf8ed;margin-bottom:1rem;overflow:hidden}
.dr{display:flex;align-items:center;gap:.5rem;padding:.6rem .65rem;border-bottom:1px solid rgba(196,164,90,0.3);cursor:pointer;min-height:48px;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.dr:active{background:rgba(196,164,90,0.15)}
.dr.today{background:rgba(139,58,26,0.07);border-left:3px solid #8b3a1a}
.dr.done .rd{text-decoration:line-through;opacity:.5}
.dr.recalc{border-left:3px solid #3a6b2a}
.ck{width:20px;height:20px;border:1.5px solid #c4a45a;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;background:white;color:#2c1f0e}
.ck.done{background:#8b3a1a;border-color:#8b3a1a;color:white}
.ck.part{background:#fff3cd;border-color:#c9a84c;color:#8b6914}
.dw{width:28px;font-size:.65rem;color:#a07840;text-transform:uppercase;flex-shrink:0}
.dt{width:54px;font-size:.72rem;color:#8b6914;flex-shrink:0}
.rd{flex:1;font-size:.88rem;line-height:1.35}
.nt{display:block;font-size:.7rem;color:#3a6b2a;margin-top:2px}
.lb{font-size:.65rem;padding:.2rem .5rem;flex-shrink:0}
.lp{display:none;align-items:center;gap:.5rem;padding:.5rem .65rem;background:#f5eed8;border-bottom:1px solid rgba(196,164,90,0.3);flex-wrap:wrap}
.lp.open{display:flex}
.lp label{font-size:.82rem;color:#8b6914}
.lp input{width:65px;padding:.3rem .4rem;border:1px solid #c4a45a;border-radius:6px;background:#fdf8ed;color:#2c1f0e;font-size:.9rem;font-family:inherit}
</style>
</head>
<body>
<div style="max-width:700px;margin:0 auto">
  <div class="hdr">
    <div style="font-size:.75rem;letter-spacing:.3em;color:#8b6914;margin-bottom:.25rem">— ✦ —</div>
    <div style="font-size:1.3rem;font-weight:600;margin-bottom:.15rem">Bible Reading Schedule</div>
    <div style="font-size:.85rem;color:#8b6914;font-style:italic" id="sub">Proverbs – Revelation · 7 chapters/day</div>
    <div class="pw"><div class="pf" id="pf" style="width:0%"></div></div>
    <div class="pl" id="pl">0 / 561 · 0%</div>
    <div class="stats">
      <div><div class="sv" id="sc">561</div><div class="sl">Chapters left</div></div>
      <div><div class="sv" id="sd">84</div><div class="sl">Days left</div></div>
      <div><div class="sv" id="sp">7</div><div class="sl">Per day</div></div>
      <div><div class="sv">Aug 31</div><div class="sl">Finish</div></div>
    </div>
  </div>
  <div class="ban" id="ban">
    <div style="font-size:.8rem;font-weight:600;color:#8b3a1a;margin-bottom:.2rem">You're behind</div>
    <div style="font-size:.82rem;color:#555;margin-bottom:.5rem" id="banTxt"></div>
    <div style="display:flex;gap:.4rem">
      <button class="pri" onclick="doRecalc()">Recalculate</button>
      <button onclick="doDismiss()">Dismiss</button>
    </div>
  </div>
  <div class="confirmbar" id="confirmbar">
    <span style="font-size:.85rem;font-weight:600;color:#8b6914">Reset all progress?</span>
    <button class="danger" onclick="doResetConfirmed()">Yes, reset</button>
    <button onclick="doCancelReset()">Cancel</button>
  </div>
  <div class="br">
    <button class="pri" onclick="doRecalc()">Recalculate plan</button>
    <button onclick="doResetAsk()">Reset all progress</button>
  </div>
  <div id="sched"></div>
</div>
<script>
var BIBLE=[["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],["Esther",10],["Job",42],["Psalms",150],["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]];
var ALL=[];var _c=false;
for(var bi=0;bi<BIBLE.length;bi++){var bk=BIBLE[bi][0],bn=BIBLE[bi][1];if(bk==="Proverbs")_c=true;if(!_c)continue;for(var ci=1;ci<=bn;ci++)ALL.push({b:bk,c:ci});}
var TOT=ALL.length,TD=84;
var S=new Date(2026,5,8),E=new Date(2026,7,31);
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function lsGet(k,def){try{var v=localStorage.getItem(k);return v!=null?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

var log=lsGet('bib_log',{});
var cp=lsGet('bib_cp',null);
var dim=lsGet('bib_dim',false);

function persist(){lsSet('bib_log',log);lsSet('bib_cp',cp);lsSet('bib_dim',dim);}

function dd(i){var d=new Date(S.getTime());d.setDate(S.getDate()+i);return d;}
function fm(d){return MO[d.getMonth()]+' '+d.getDate();}
function ti(){return Math.max(0,Math.min(Math.floor((new Date()-S)/86400000),TD-1));}
function dl(){return Math.max(0,Math.floor((E-new Date())/86400000)+1);}
function mkPlan(){var p=[];var idx=0;for(var d=0;d<TD;d++){var t=(cp&&cp[d]!=null)?cp[d]:7;var s=idx,e=Math.min(idx+t,TOT);p.push({d:d,date:dd(d),s:s,e:e,t:t});idx=e;if(idx>=TOT){for(var r=d+1;r<TD;r++)p.push({d:r,date:dd(r),s:TOT,e:TOT,t:0});break;}}return p;}
function grp(ch){var o=[];var i=0;while(i<ch.length){var b=ch[i].b,s=ch[i].c,e=s;while(i+1<ch.length&&ch[i+1].b===b){i++;e=ch[i].c;}o.push({b:b,s:s,e:e});i++;}return o;}
function totRead(plan){var total=0;for(var i=0;i<plan.length;i++){var p=plan[i],av=p.e-p.s,r=log[p.d]!=null?Math.min(log[p.d],av):0;total+=r;}return total;}
function beh(plan){var t=ti(),total=0;for(var i=0;i<=t&&i<plan.length;i++){var p=plan[i],av=p.e-p.s,r=log[p.d]!=null?Math.min(log[p.d],av):0;if(p.d<t)total+=(av-r);else if(p.d===t&&r>0&&r<av)total+=(av-r);}return total;}

function doResetAsk(){document.getElementById('confirmbar').classList.add('show');}
function doCancelReset(){document.getElementById('confirmbar').classList.remove('show');}
function doResetConfirmed(){log={};cp=null;dim=false;lsDel('bib_log');lsDel('bib_cp');lsDel('bib_dim');document.getElementById('confirmbar').classList.remove('show');render();}
function doRecalc(){var plan=mkPlan(),rem=TOT-totRead(plan),t=ti(),dL=TD-t;if(!dL||!rem)return;var base=Math.floor(rem/dL),ex=rem%dL;var np={};if(cp){for(var k in cp)np[k]=cp[k];}for(var d=0;d<t;d++)np[d]=plan[d]?plan[d].t:7;for(var d=t;d<TD;d++)np[d]=base+((d-t)<ex?1:0);cp=np;dim=false;persist();render();}
function doDismiss(){dim=true;persist();render();}
function doRowClick(d,av){if(!av)return;var r=log[d]!=null?log[d]:0;if(r>=av)delete log[d];else log[d]=av;dim=false;persist();render();}
function doOpenLog(d,av,cur){var els=document.querySelectorAll('.lp.open');for(var i=0;i<els.length;i++)els[i].classList.remove('open');var lp=document.getElementById('lp'+d);if(lp){lp.classList.add('open');var inp=document.getElementById('li'+d);if(inp)inp.value=cur;}}
function doSaveLog(d,av){var inp=document.getElementById('li'+d);if(!inp)return;var v=parseInt(inp.value);if(isNaN(v)||v<0)return;if(v===0)delete log[d];else log[d]=Math.min(v,av);dim=false;var lp=document.getElementById('lp'+d);if(lp)lp.classList.remove('open');persist();render();}
function doCancelLog(d){var lp=document.getElementById('lp'+d);if(lp)lp.classList.remove('open');}

function render(){
  var plan=mkPlan(),read=totRead(plan),rem=TOT-read,d=dl(),ppd=d>0?Math.ceil(rem/d):0;
  var pct=Math.round(read/TOT*100),t=ti(),tds=dd(t).toDateString(),behind=beh(plan);
  document.getElementById('sc').textContent=rem;
  document.getElementById('sd').textContent=d;
  document.getElementById('sp').textContent=ppd;
  document.getElementById('sub').textContent='Proverbs – Revelation · '+ppd+' chapters/day';
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pl').textContent=read+' / '+TOT+' · '+pct+'%';
  var ban=document.getElementById('ban');
  if(behind>0&&!dim){ban.classList.add('show');document.getElementById('banTxt').textContent=behind+' chapter'+(behind>1?'s':'')+' behind — recalculate to spread '+rem+' chapters over '+d+' days ('+Math.ceil(rem/d)+'/day).';}
  else{ban.classList.remove('show');}
  var weeks=[];for(var i=0;i<TD;i+=7)weeks.push(plan.slice(i,i+7));
  var html='';
  for(var w=0;w<weeks.length;w++){
    var wk=[];for(var x=0;x<weeks[w].length;x++){if(weeks[w][x])wk.push(weeks[w][x]);}
    if(!wk.length)continue;
    html+='<div class="wh">Week '+(w+1)+' · '+fm(wk[0].date)+' – '+fm(wk[wk.length-1].date)+'</div><div class="wb">';
    for(var j=0;j<wk.length;j++){
      var p=wk[j],ch=ALL.slice(p.s,p.e),av=ch.length,r=log[p.d]!=null?Math.min(log[p.d],av):0;
      var done=(r>=av&&av>0),part=(r>0&&!done),isT=p.date.toDateString()===tds,isR=cp&&cp[p.d]!=null&&cp[p.d]!==7;
      var rc='dr';if(done)rc+=' done';if(part)rc+=' part';if(isT)rc+=' today';if(isR&&!done&&!part)rc+=' recalc';
      var gs=grp(ch),rdg='';
      if(av>0){for(var k=0;k<gs.length;k++){if(k>0)rdg+=' · ';rdg+=gs[k].b+' <span style="color:#8b3a1a;font-style:italic">'+(gs[k].s===gs[k].e?gs[k].s:gs[k].s+'–'+gs[k].e)+'</span>';}}
      else rdg='<em style="color:#aaa">—</em>';
      var note=part?'<span class="nt">Read '+r+' of '+av+'</span>':(isR&&!done?'<span class="nt">↺ recalculated: '+av+' chapters</span>':'');
      var ckc=done?'ck done':part?'ck part':'ck',ckl=done?'✓':part?'½':'';
      html+='<div class="'+rc+'" onclick="doRowClick('+p.d+','+av+')">';
      html+='<div class="'+ckc+'">'+ckl+'</div>';
      html+='<div class="dw">'+DW[p.date.getDay()]+'</div>';
      html+='<div class="dt">'+fm(p.date)+'</div>';
      html+='<div class="rd">'+rdg+note+'</div>';
      if(!done&&av>0)html+='<button class="lb" onclick="event.stopPropagation();doOpenLog('+p.d+','+av+','+r+')">Log</button>';
      html+='</div>';
      html+='<div class="lp" id="lp'+p.d+'"><label>Chapters read:</label><input type="number" min="0" max="'+av+'" id="li'+p.d+'" value="'+r+'" onclick="event.stopPropagation()"><button onclick="event.stopPropagation();doSaveLog('+p.d+','+av+')">Save</button><button onclick="event.stopPropagation();doCancelLog('+p.d+')">Cancel</button></div>';
    }
    html+='</div>';
  }
  document.getElementById('sched').innerHTML=html;
}
render();
</script>
</body>
</html>
